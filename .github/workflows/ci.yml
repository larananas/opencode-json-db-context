name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs should not occupy scarce ARM64/macOS CI runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.label }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Linux-x64, runner: ubuntu-24.04, python: '3.13', architecture: x64 }
          - { label: Linux-ARM64, runner: ubuntu-24.04-arm, python: '3.13', architecture: arm64 }
          - { label: Windows-x64, runner: windows-2025, python: '3.13', architecture: x64 }
          # Windows ARM64 host: x64 CPython uses the built-in Windows emulator.
          # Some MCP transitive packages do not publish win_arm64 wheels.
          - { label: Windows-ARM64-x64-emulated, runner: windows-11-arm, python: '3.13', architecture: x64 }
          - { label: macOS-Intel, runner: macos-15-intel, python: '3.13', architecture: x64 }
          - { label: macOS-ARM64, runner: macos-15, python: '3.13', architecture: arm64 }
          - { label: Linux-x64-Python310, runner: ubuntu-24.04, python: '3.10', architecture: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Verify project publication policy
        run: python scripts/check_publication.py
      - name: Diagnose missing dependencies (read-only)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          sh ./setup.sh --check > check-output.txt 2>&1
          status=$?
          set -e
          cat check-output.txt
          test "$status" -eq 1
          grep -q 'missing/incomplete' check-output.txt
          test ! -e .opencode/opencode.jsonc
      - name: Diagnose missing dependencies (read-only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # setup.ps1 deliberately exits nonzero for a fresh checkout. Run it in
          # a subprocess so its exit statement cannot terminate this CI wrapper.
          $psExe = (Get-Process -Id $PID).Path
          $probe = Start-Process -FilePath $psExe -ArgumentList @('-NoProfile', '-File', './setup.ps1', '-Check') -NoNewWindow -PassThru -Wait
          if ($probe.ExitCode -ne 1) { throw "Fresh checkout diagnostic returned $($probe.ExitCode), expected 1" }
          if (Test-Path .opencode/opencode.jsonc) { throw 'Check unexpectedly generated local configuration' }
      - name: Test interactive setup with explicit CI approval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $psExe = (Get-Process -Id $PID).Path
          $setup = Start-Process -FilePath $psExe -ArgumentList @('-NoProfile', '-File', './setup.ps1', '-Yes') -NoNewWindow -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Windows setup returned $($setup.ExitCode)" }
          $check = Start-Process -FilePath $psExe -ArgumentList @('-NoProfile', '-File', './setup.ps1', '-Check') -NoNewWindow -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw "Windows setup verification returned $($check.ExitCode)" }
      - name: Test interactive setup with explicit CI approval (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh ./setup.sh --yes
          sh ./setup.sh --check
      - name: Test MCP SDK imports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.venv/Scripts/python.exe -c 'import mcp,pymysql,pg8000,oracledb,pytds'
      - name: Test MCP SDK imports (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: ./.venv/bin/python -c 'import mcp,pymysql,pg8000,oracledb,pytds'
      - name: Check real MCP startup and tool discovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/check_mcp_startup.py
      - name: Check real MCP startup and tool discovery (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: ./.venv/bin/python scripts/check_mcp_startup.py
      - name: Run all non-live tests
        run: python -m unittest discover -s tests -v
      - name: Verify local config is never tracked
        shell: bash
        run: |
          git check-ignore -q .opencode/opencode.jsonc
          git check-ignore -q .local/example.env
          git check-ignore -q export/sample.json
